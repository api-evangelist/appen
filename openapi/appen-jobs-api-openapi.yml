  /v3/jobs/pause:
    post:
      tags:
      - Jobs
      summary: Pause job
      description: 'Temporarily stops a running job, pausing all new contributor assignments while preserving current progress. This allows you to halt work without losing completed annotations.


        **What Happens When You Pause:**

        - Job status changes from DRAFT to PAUSED

        - Contributors cannot start new assignments

        - No new units are distributed to contributors

        - All progress and judgments are preserved'
      operationId: pauseJob
      parameters:
      - name: jobId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Job identifier to pause
        example: 2b9ebe3d-1ff2-461d-a0c8-66e86b239b57
      x-codeSamples:
      - lang: curl
        label: Pause Job
        source: "curl -X POST \"https://api.appen.com/v3/jobs/pause?jobId=<jobId>\" \\\n  -H \"Authorization: Token token=<your-api-key>\"\n"
      responses:
        '200':
          description: Job paused successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/JobDTO'
              example:
                message: success
                code: 200
                data:
                  id: 2b9ebe3d-1ff2-461d-a0c8-66e86b239b57
                  state: PAUSED
                  title: Paused Job
                traceId: trace-123
                time: '2025-07-09T03:19:22Z'
        '400':
          description: Bad request - Invalid job ID or job already paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_job_id:
                  summary: Invalid job ID
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Invalid job ID
                    path: /v3/jobs/pause
                job_already_paused:
                  summary: Job already paused
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job already paused
                    path: /v3/jobs/pause
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 403
                error: Forbidden
                message: Access denied. Check your privileges.
                path: /v3/jobs/pause
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 500
                error: Internal Server Error
                message: Failed to pause job
                path: /v3/jobs/pause
      security:
      - TokenAuth: []
  /v3/jobs/launch:
    post:
      tags:
      - Jobs
      summary: Launch & Resume/Run job
      description: 'Activates a previously created job, making it available for contributors to work on. This transitions the job from PAUSE to RUNNING state and begins the actual annotation process.


        # Contributor Access URL Construction


        With this release, customers can now generate the Contributor Access URL programmatically.


        ### URL Structure

        ```

        https://account.appen.com/quality/tasks/{jobId}?secret={secret}

        ```


        ### Components

        - **Base URL**: `https://account.appen.com/quality/tasks/` (constant string)

        - **Job ID**: Returned in the response of the Create Job API (example: `2d215241-00bc-4453-bac3-449387a78190`)

        - **Secret**: Returned in the response of the Update Job Settings API (example: `xicPrChRfj28e7GLZiDykuTDQZqpJYv6QkBRLacU5bp4eE`)


        ### Example Construction

        ```

        https://account.appen.com/quality/tasks/2d215241-00bc-4453-bac3-449387a78190?secret=xicPrChRfj28e7GLZiDykuTDQZqpJYv6QkBRLacU5bp4eE

        ```


        **Limitations:**

        - Jobs can be launched only in ‘Work’ mode but NOT in either ‘Quiz’ mode / ‘Quiz+Work’ mode. Test Question feature will be supported in the subsequent releases,then the Jobs can be launched in all modes.

        - Management of Internal/External contributors through crowd type will be supported in the subsequent releases.'
      operationId: launchJob
      parameters:
      - name: jobId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Job identifier to launch
        example: 46deb496-749a-41de-8af8-d4b5890aa484
      x-codeSamples:
      - lang: curl
        label: Launch & Resume/Run job
        source: "curl -X POST \"https://api.appen.com/v3/jobs/launch?jobId=<jobId>\" \\\n  -H \"Authorization: Token token=<your-api-key>\"\n"
      responses:
        '200':
          description: Job launched successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/JobDTO'
              example:
                message: success
                code: 200
                data:
                  id: 46deb496-749a-41de-8af8-d4b5890aa484
                  state: RUNNING
                  title: Launched Job
                traceId: trace-123
                time: '2025-07-09T03:19:22Z'
        '400':
          description: Bad request - Invalid job ID or job already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_job_id:
                  summary: Invalid job ID
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Invalid job ID
                    path: /v3/jobs/launch
                job_settings_not_saved:
                  summary: Job settings not saved
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job settings not saved
                    path: /v3/jobs/launch
                job_already_running:
                  summary: Job already running
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job already running
                    path: /v3/jobs/launch
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 403
                error: Forbidden
                message: Access denied. Check your privileges.
                path: /v3/jobs/launch
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 500
                error: Internal Server Error
                message: Failed to launch job
                path: /v3/jobs/launch
