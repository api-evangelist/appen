openapi: 3.2.0
info:
  title: Appen AI Data Annotation Platform (ADAP) Jobs API
  description: '# Introduction


    The Appen AI Data Annotation Platform (ADAP) APIs offer a structured, automated approach to ensure high-quality data labeling on a scale.'
servers:
- url: https://api.appen.com/
  description: Production environment
security:
- TokenAuth: []
tags:
- name: Jobs
  description: Job management operations for creating, configuring, and controlling data annotation workflows.
paths:
  /v3/jobs/jobs.json:
    post:
      tags:
      - Jobs
      summary: Create a new job
      description: 'Initializes a new job within a project. Many fields are auto-populated and cannot be overridden.


        **Supported Job Types:**

        - **WORK**: Standard work jobs for data collection and annotation

        - **QA**: Quality assurance/Leading QA jobs


        **Current Limitations:**

        - Work Jobs requiring Ontology and qualification jobs will be supported in next version of the release

        - By default the created Jobs will be in ''Draft'' status

        - Job type must be either WORK or QA (other types not supported)'
      operationId: createJob
      x-codeSamples:
      - lang: curl
        label: Create Job
        source: "curl -X POST \"https://api.appen.com/v3/jobs/jobs.json\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"title\": \"Your Job Title\",\n    \"projectId\": \"e74c1b9d-16ff-4a29-8c4c-e3147877de1b\",\n    \"type\": \"WORK\"\n  }'\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - projectId
              - type
              properties:
                title:
                  type: string
                  description: Title for the new job - must be unique within the project (required)
                  example: Your Job Title
                projectId:
                  type: string
                  format: uuid
                  description: ID of the project where the job will be created (required)
                  example: e74c1b9d-16ff-4a29-8c4c-e3147877de1b
                type:
                  type: string
                  description: Job type - must be either WORK or QA (required)
                  enum:
                  - WORK
                  - QA
                  example: WORK
            examples:
              work_job:
                summary: Create a WORK job
                value:
                  title: My Work Job
                  projectId: e74c1b9d-16ff-4a29-8c4c-e3147877de1b
                  type: WORK
              qa_job:
                summary: Create a QA job
                value:
                  title: My QA Job
                  projectId: e74c1b9d-16ff-4a29-8c4c-e3147877de1b
                  type: QA
      responses:
        '200':
          description: Job created successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/JobDTO'
              example:
                message: success
                data:
                  id: 68624cd9-8899-4107-bc3a-f69d91db4d3e
                  projectId: e74c1b9d-16ff-4a29-8c4c-e3147877de1b
                  teamId: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
                  title: Your Job Title
                  type: WORK
                  state: DRAFT
                  feedback: DISABLED
                  assignmentLeaseExpiry: 1800
                  rowsPerPage: 5
                  judgmentsPerRow: 1
                  sendBackOp: SEND_BACK_TO_SAME_CONTRIBUTOR
                  judgmentModifiable: false
                  allowSelfQa: false
                  allowAbandonUnits: true
                  createdAt: '2025-07-09T03:19:20Z'
                code: 200
                time: '2025-07-09T03:19:22Z'
        '400':
          description: Bad request - Missing required fields or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_project:
                  summary: Missing project
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Project is required
                    path: /v3/jobs/jobs.json
                missing_title:
                  summary: Missing title
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job title is required
                    path: /v3/jobs/jobs.json
                invalid_project_id:
                  summary: Invalid project ID
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Invalid project Id
                    path: /v3/jobs/jobs.json
                duplicate_title:
                  summary: Job title already exists
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job title already exists
                    path: /v3/jobs/jobs.json
                invalid_job_type:
                  summary: Invalid job type
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Job type must be either WORK or QA
                    path: /v3/jobs/jobs.json
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 403
                error: Forbidden
                message: Access denied. Check your privileges.
                path: /v3/jobs/jobs.json
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 500
                error: Internal Server Error
                message: Failed to create job
                path: /v3/jobs/jobs.json
      security:
      - TokenAuth: []
  /v3/project-flow/projects/jobs/copy-job:
    post:
      tags:
      - Jobs
      summary: Copy an existing job within a project
      description: 'Creates a copy of an existing job within the same project.

        This endpoint allows you to duplicate job configurations including design, contributor settings,

        and row settings, making it easy to create similar jobs without starting from scratch.


        **What gets copied:**

        - Basic job metadata (title, type, description)

        - Job design/CML configuration (if `DESIGN` is included in `types`)

        - Contributor settings (if `CROWD_SETTINGS` is included in `types`)

        - Row settings and pricing configuration (if `PRICE_AND_ROW` is included in `types`)

        - Quality/Leading QA settings (if `QUALITY_SETTINGS` is included in `types`)


        **Important Notes:**

        - The copied job will be created in `DRAFT` status

        - Jobs can only be copied within the same project (source job and target project must match)

        - The job title must be unique within the project

        - The `appendTo` field must be set to `project_data_source`


        **Limitations**

        - Only WORK jobs and Leading QA jobs can be copied. Copying of following QA jobs will be supported in the further releases.


        **Validation:**

        - Only allowed values for `types`: `DESIGN`, `CROWD_SETTINGS`, `PRICE_AND_ROW`, `QUALITY_SETTINGS`

        - `QUALITY_SETTINGS` can only be used when copying from a QA/Leading QA job (not WORK jobs)'
      operationId: copyJob
      x-codeSamples:
      - lang: curl
        label: Copy WORK Job with All Settings
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects/jobs/copy-job?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"copiedFrom\": \"63311198-5481-4312-ae33-f9fcf1423191\",\n    \"projectId\": \"fbff3f10-7105-4e52-afef-00fe21a3100e\",\n    \"title\": \"Copy of My Work Job\",\n    \"appendTo\": \"project_data_source\",\n    \"types\": [\"DESIGN\", \"CROWD_SETTINGS\", \"PRICE_AND_ROW\"]\n  }'\n"
      - lang: curl
        label: Copy Leading QA Job with All Settings
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects/jobs/copy-job?teamId=cf22e84f-06c8-4955-b626-1c47d245a176\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"copiedFrom\": \"e19bc365-aa0e-4a23-9188-a2ac11b7016d\",\n    \"projectId\": \"567ac5fa-b7bf-454c-9459-4e878a5b0280\",\n    \"title\": \"Copy of Leading QA Job\",\n    \"appendTo\": \"project_data_source\",\n    \"types\": [\"QUALITY_SETTINGS\", \"DESIGN\", \"CROWD_SETTINGS\", \"PRICE_AND_ROW\"]\n  }'\n"
      - lang: curl
        label: Copy Job with Design Only
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects/jobs/copy-job?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"copiedFrom\": \"63311198-5481-4312-ae33-f9fcf1423191\",\n    \"projectId\": \"fbff3f10-7105-4e52-afef-00fe21a3100e\",\n    \"title\": \"Job with Same Design\",\n    \"appendTo\": \"project_data_source\",\n    \"types\": [\"DESIGN\"]\n  }'\n"
      - lang: curl
        label: Copy Job with Crowd Settings Only
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects/jobs/copy-job?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"copiedFrom\": \"63311198-5481-4312-ae33-f9fcf1423191\",\n    \"projectId\": \"fbff3f10-7105-4e52-afef-00fe21a3100e\",\n    \"title\": \"Job with Same Crowd Settings\",\n    \"appendTo\": \"project_data_source\",\n    \"types\": [\"CROWD_SETTINGS\"]\n  }'\n"
      - lang: curl
        label: Copy Job with Row Settings Only
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects/jobs/copy-job?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"copiedFrom\": \"63311198-5481-4312-ae33-f9fcf1423191\",\n    \"projectId\": \"fbff3f10-7105-4e52-afef-00fe21a3100e\",\n    \"title\": \"Job with Same Row Settings\",\n    \"appendTo\": \"project_data_source\",\n    \"types\": [\"PRICE_AND_ROW\"]\n  }'\n"
      parameters:
      - name: teamId
        in: query
        required: true
        description: The team ID that owns both the source job and target project
        schema:
          type: string
          format: uuid
        example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
      requestBody:
        required: true
        description: "Job copy configuration specifying the source job, target project, new job title, \nand which components to copy.\n"
        content:
          application/json:
            schema:
              type: object
              required:
              - copiedFrom
              - projectId
              - title
              properties:
                copiedFrom:
                  type: string
                  format: uuid
                  description: ID of the source job to copy from (required)
                  example: 63311198-5481-4312-ae33-f9fcf1423191
                projectId:
                  type: string
                  format: uuid
                  description: ID of the target project where the job will be created (required)
                  example: fbff3f10-7105-4e52-afef-00fe21a3100e
                title:
                  type: string
                  description: Title for the new job - must be unique within the target project (required)
                  example: Copy of My Job
                  maxLength: 255
                appendTo:
                  type: string
                  description: Data source type - must be 'project_data_source'
                  enum:
                  - project_data_source
                  default: project_data_source
                  example: project_data_source
                types:
                  type: array
                  description: 'Components to copy from the source job. Leave empty to copy basic structure only.

                    - **DESIGN**: Copy job design/CML configuration

                    - **CROWD_SETTINGS**: Copy contributor settings

                    - **PRICE_AND_ROW**: Copy row settings and pricing configuration

                    - **QUALITY_SETTINGS**: Copy quality/leading QA settings

                    '
                  items:
                    type: string
                    enum:
                    - DESIGN
                    - CROWD_SETTINGS
                    - PRICE_AND_ROW
                    - QUALITY_SETTINGS
                  example:
                  - DESIGN
                  - CROWD_SETTINGS
                  - PRICE_AND_ROW
                  - QUALITY_SETTINGS
            examples:
              work_job_full_copy:
                summary: Copy WORK job with all settings
                value:
                  copiedFrom: 63311198-5481-4312-ae33-f9fcf1423191
                  projectId: fbff3f10-7105-4e52-afef-00fe21a3100e
                  title: Copy of Work Job
                  appendTo: project_data_source
                  types:
                  - DESIGN
                  - CROWD_SETTINGS
                  - PRICE_AND_ROW
              qa_job_full_copy:
                summary: Copy Leading QA job with all settings including quality settings
                value:
                  copiedFrom: e19bc365-aa0e-4a23-9188-a2ac11b7016d
                  projectId: 567ac5fa-b7bf-454c-9459-4e878a5b0280
                  title: Copy of Leading QA Job
                  appendTo: project_data_source
                  types:
                  - QUALITY_SETTINGS
                  - DESIGN
                  - CROWD_SETTINGS
                  - PRICE_AND_ROW
              design_only:
                summary: Copy design/CML only
                value:
                  copiedFrom: 63311198-5481-4312-ae33-f9fcf1423191
                  projectId: fbff3f10-7105-4e52-afef-00fe21a3100e
                  title: Job with Same Design
                  appendTo: project_data_source
                  types:
                  - DESIGN
              crowd_settings_only:
                summary: Copy crowd/contributor settings only
                value:
                  copiedFrom: 63311198-5481-4312-ae33-f9fcf1423191
                  projectId: fbff3f10-7105-4e52-afef-00fe21a3100e
                  title: Job with Same Crowd Settings
                  appendTo: project_data_source
                  types:
                  - CROWD_SETTINGS
              row_settings_only:
                summary: Copy row settings and pricing only
                value:
                  copiedFrom: 63311198-5481-4312-ae33-f9fcf1423191
                  projectId: fbff3f10-7105-4e52-afef-00fe21a3100e
                  title: Job with Same Row Settings
                  appendTo: project_data_source
                  types:
                  - PRICE_AND_ROW
      responses:
        '200':
          description: Job copied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Job copied successfully
                  data:
                    $ref: '#/components/schemas/JobDTO'
                  traceId:
                    type: string
                    description: Trace ID for tracking the request
                    example: abc-123-xyz
                  timestamp:
                    type: string
                    format: date-time
                    example: '2025-10-21T07:46:52.429060Z'
              example:
                status: 200
                message: Job copied successfully
                data:
                  id: 789d7bc2-2c7b-48ee-89f1-9e99cfcc9b3b
                  version: 2
                  projectId: 61ffd5af-cada-4452-a80b-57b46ded1958
                  teamId: cf22e84f-06c8-4955-b626-1c47d245a176
                  title: Copy of job1
                  displayId: null
                  cycleNumber: 0
                  feedback: DISABLED
                  flowId: 789d7bc2-2c7b-48ee-89f1-9e99cfcc9b3b
                  type: QA
                  state: DRAFT
                  activeStatus: ACTIVE
                  assignmentLeaseExpiry: 1200
                  judgmentsPerRow: 1
                  rowsPerPage: 10
                  displayContributorName: null
                  judgmentModifiable: false
                  sendBackOp: NO_OP
                  copiedFrom: 2ec45e4f-3a2d-4fd1-b3d7-ab36f6cb1e0a
                  maxJudgmentPerContributorEnabled: false
                  maxJudgmentPerContributor: 0
                  maxSkippablePromptNum: 0
                  unitSegmentType: UNIT_ONLY
                  internalSecret: OwHv0Ohwaq3BSLHeIqsazG2kjKrE9KB1ZmLWsAK7AaiJZC
