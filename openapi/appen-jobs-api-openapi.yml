                status: 500
                errorCode: 4500
                error: Internal Server Error
                message: 'Failed to copy job: Internal service error'
                path: /v3/project-flow/projects/jobs/copy-job
                traceId: abc-123-xyz
      security:
      - TokenAuth: []
  /v3/project-flow/projects/jobs/status:
    get:
      tags:
      - Jobs
      summary: Get job status
      description: 'Retrieves the current status and progress metrics for a specific job.


        This endpoint provides comprehensive job progress information including:

        - **Completion percentage**: Overall job completion progress (0-100%)

        - **Unit statistics**: Total units and submitted units in the job

        - **Judgment statistics**: Total and submitted judgments for the job

