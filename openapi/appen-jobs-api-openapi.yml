                  testQuestionSettings: null
                  operateHistoryId: a75eb471-007c-464e-adb1-cf144ecca3a7
                  payRateType: ''
                  invoiceStatisticsType: UNIT_COUNT
                  createdAt: '2025-10-23T06:40:58.949371Z'
                  allowSelfQa: true
                  allowAbandonUnits: true
                  maxNumberOfAllowedAbandonment: 3
                  sendAbandonedUnitsBackToJob: true
                  instruction: ''
