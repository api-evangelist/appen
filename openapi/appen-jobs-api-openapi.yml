      - TokenAuth: []
components:
  schemas:
    JobDTO:
      type: object
      description: 'Job Data Transfer Object for updating job settings.


        ## FIELD OVERVIEW


        ** REQUIRED (5):** `id`, `projectId`, `teamId`, `title`, `type`


        ** CORE CONFIG:** `version`, `assignmentLeaseExpiry`, `judgmentsPerRow`, `rowsPerPage`, `displayContributorName`, `judgmentModifiable`


        ** WORKFLOW:** `state`, `activeStatus`, `feedback`, `sendBackOp`, `unitSegmentType`, `allowSelfQa`, `allowAbandonUnits`


        ** TIME & LIMITS:** `timeLimitThresholdSec` (0-100%), `enableExpirationTime`, `expirationDurationSet`, `expirationDurationUpdate`


        ** QUALITY:** `dynamicJudgements` (minimumConfidence 0.0-1.0), `threshold` (0.0-1.0), `maxJudgmentPerContributor`


        ** FEATURES:** `enableBlueTooth`, `enableShareLink`, `enableExternalAutoAssignJob`, `launchPlatform`, `latestAppVersion`


        ** SESSION:** `totalSessionNumber`, `reusablePrompt`, `reusablePin`, `maxSkippablePromptNum`


        ** CONTENT:** `instruction`, `jobCml`, `jobFilter`, `jobCrowd`, `testQuestionSettings`


        ** BUSINESS:** `payRateType`, `invoiceStatisticsType`, `validationRuleId`, `qaAdvancedOptions`


        ** METADATA:** `createdAt`, `displayId`, `flowId`, `internalSecret`, `copiedFrom` (read-only fields)


        ## KEY RULES

        - TeamId must match query parameter | Job titles must be unique in project

        - Negative values not allowed for: time, expiration, confidence fields

        - timeLimitThresholdSec is percentage (0-100), not seconds

        - When enableExpirationTime > 0, duration fields must be > 0

        - WORK jobs cannot have feedback ENABLED

        '
      required:
      - id
      - projectId
      - teamId
      - title
      - type
      properties:
        id:
          type: string
          description: '**REQUIRED**: Unique job identifier (UUID). Identifies the job to update.'
          example: 3f9b42ee-da0e-41a0-9dcd-5c59096cee98
        version:
          type: integer
          description: '**RECOMMENDED**: Job version for optimistic locking. Prevents conflicting updates.'
          example: 21
        projectId:
          type: string
          description: '**REQUIRED**: Project identifier (UUID). Must have access to this project.'
          example: e74c1b9d-16ff-4a29-8c4c-e3147877de1b
        teamId:
          type: string
          maxLength: 50
          description: '**REQUIRED**: Team identifier (UUID). Must match teamId query parameter.'
          example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
        title:
          type: string
          description: '**REQUIRED**: Job title. Must be unique within project (error 60080 if duplicate).'
          example: Updated Job Title
        displayId:
          type: integer
          description: '**READ-ONLY**: Auto-generated human-readable job ID. Default: auto-generated.'
          example: 837054
        cycleNumber:
          type: integer
          minimum: 0
          description: '**OPTIONAL**: Job cycle number. Default: 0, Range: ≥0.'
          example: 0
        feedback:
          type: string
          enum:
          - ENABLED
          - DISABLED
          description: '**OPTIONAL**: Contributor feedback setting. Default: DISABLED. WORK jobs cannot have ENABLED.'
          example: DISABLED
        flowId:
          type: string
          description: '**OPTIONAL**: Workflow identifier (UUID). Default: same as job ID.'
          example: 3f9b42ee-da0e-41a0-9dcd-5c59096cee98
        type:
          type: string
          enum:
          - WORK
          - QA
          description: '**REQUIRED**: Job type. WORK = standard job, QA = quality assurance. WORK jobs cannot have feedback ENABLED.'
          example: WORK
        state:
          type: string
          enum:
          - DRAFT
          - RUNNING
          - PAUSED
          - COMPLETED
          - CANCELLED
          description: '**OPTIONAL**: Current job state. Controls job execution status.'
          example: PAUSED
        activeStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          description: '**OPTIONAL**: Job active status. Default: ACTIVE.'
          example: ACTIVE
        assignmentLeaseExpiry:
          type: integer
          minimum: 60
          description: '**RECOMMENDED**: Assignment lease time in seconds. Min: 60, controls how long assignments are held.'
          example: 1800
        judgmentsPerRow:
          type: integer
          minimum: 1
          description: '**RECOMMENDED**: Judgments required per row. Default: 1, Min: 1. Higher = more consensus.'
          example: 13
        rowsPerPage:
          type: integer
          minimum: 1
          description: '**RECOMMENDED**: Rows per assignment page. Min: 1, controls assignment size.'
          example: 12
        displayContributorName:
          type: boolean
          description: '**OPTIONAL**: Show contributor names. Default: false (anonymous).'
          example: true
        judgmentModifiable:
          type: boolean
          description: '**OPTIONAL**: Allow judgment editing after submission. Default: false.'
          example: true
        sendBackOp:
          type: string
          enum:
          - SEND_BACK_TO_SAME_CONTRIBUTOR
          - SEND_BACK_TO_ANY_CONTRIBUTOR
          - SEND_BACK_TO_POOL
          - IGNORE
          description: '**OPTIONAL**: Rejected work handling. Default: SEND_BACK_TO_SAME_CONTRIBUTOR.'
          example: SEND_BACK_TO_POOL
        copiedFrom:
          type:
          - string
          - 'null'
          description: '**READ-ONLY**: ID of job this was copied from (if applicable).


            - **Default**: null

            - **Purpose**: Track job lineage for copied jobs

            - **Note**: Set automatically when copying jobs

            '
          example: null
        maxJudgmentPerContributorEnabled:
          type: boolean
          description: '**OPTIONAL**: Whether to limit judgments per contributor.


            - **Default**: false

            - **Purpose**: Enable contributor workload limits

            - **Related**: Works with maxJudgmentPerContributor field

            '
          example: true
        maxJudgmentPerContributor:
          type: integer
          minimum: 0
          description: '**OPTIONAL**: Maximum judgments per contributor.


            - **Default**: 0 (unlimited)

            - **Range**: ≥ 0 (0 = unlimited, positive values set limit)

            - **Purpose**: Prevent single contributor from dominating job

            - **Requirement**: Only applies when maxJudgmentPerContributorEnabled = true

            '
          example: 0
        maxSkippablePromptNum:
          type: integer
          minimum: 0
          description: '**OPTIONAL**: Maximum number of skippable prompts.


            - **Default**: 0 (no skipping allowed)

            - **Range**: ≥ 0 (0 = no skipping, positive values allow skipping)

            - **Purpose**: Allow contributors to skip difficult assignments

            '
          example: 0
        unitSegmentType:
          type: string
          enum:
          - UNIT_ONLY
          - UNIT_SEGMENT
          - UNIT_WITH_PREVIEW
          description: "**OPTIONAL**: Unit segment type for data presentation.\n\n- **Default**: UNIT_ONLY\n- **Values**:\n  - UNIT_ONLY: Present data as single units\n  - UNIT_SEGMENT: Present data in segments\n  - UNIT_WITH_PREVIEW: Include preview capability\n- **Purpose**: Controls how data is structured for contributors\n"
          example: UNIT_ONLY
        internalSecret:
          type: string
          description: '**SYSTEM**: Internal secret for job access (auto-generated).


            - **Default**: Auto-generated secure string

            - **Purpose**: Internal authentication token

            - **Note**: Do not modify unless specifically required

            '
          example: V1TeRYacyzXeb0hzQzMLzM6iQGBm5dgkMYg7wpF1PJyCfi
        createdAt:
          type: string
          format: date-time
          description: Job creation timestamp
          example: '2025-06-17T09:23:27.639930Z'
        allowSelfQa:
          type: boolean
          description: Whether self QA is allowed
          example: false
        allowAbandonUnits:
          type: boolean
          description: Whether units can be abandoned
          example: true
        maxNumberOfAllowedAbandonment:
          type: integer
          minimum: 0
          description: Maximum number of allowed abandonments (must be non-negative)
          example: 3
        sendAbandonedUnitsBackToJob:
          type: boolean
          description: Whether abandoned units are sent back to job
          example: true
        instruction:
          type: string
          description: Job instructions
          example: Updated instructions
        validationRuleId:
          type:
          - string
          - 'null'
          description: Validation rule identifier
          example: null
        enableBlueTooth:
          type: boolean
          description: Whether Bluetooth is enabled
          example: false
        launchPlatform:
          type: array
          items:
            type: string
          description: Launch platforms
          example: []
        latestAppVersion:
          type: boolean
          description: Whether latest app version is required
          example: false
        reusablePrompt:
          type: boolean
          description: Whether prompts are reusable
          example: false
        reusablePin:
          type: boolean
          description: Whether pins are reusable
          example: false
        totalSessionNumber:
          type: integer
          minimum: 0
          description: Total number of sessions (0 = no limit, positive values set session limit)
          example: 0
        firstLaunchTime:
          type:
          - string
          - 'null'
          format: date-time
          description: First launch timestamp
          example: null
        promptsEnabling:
          type:
          - string
          - 'null'
          description: Prompts enabling configuration
          example: null
        reviewReasons:
          type: string
          description: Review reasons
          example: ''
        reviewReasonOption:
          type: string
          description: Review reason option
          example: SINGLE
        parentJobId:
          type:
          - string
          - 'null'
          description: Parent job identifier
          example: null
        unitGroupOption:
          type: string
          description: Unit group option
          example: RETAIN
        appendable:
          type: boolean
          description: '**OPTIONAL**: Allow job data appending. Default: false.'
          example: false
        enableShareLink:
          type: boolean
          description: '**OPTIONAL**: Enable job sharing links. Default: false.'
          example: true
        payRateType:
          type: string
          description: '**OPTIONAL**: Payment rate type. Default: empty string.'
          example: ''
        invoiceStatisticsType:
          type: string
          enum:
          - UNIT_COUNT
          - JUDGMENT_COUNT
          - TIME_BASED
          description: '**OPTIONAL**: Invoice statistics calculation type. Default: UNIT_COUNT.'
          example: UNIT_COUNT
        operateHistoryId:
          type: string
          description: '**SYSTEM**: Operation history identifier (auto-generated).'
          example: 400681a4-d27e-485d-9491-ae9fadec9cd8
        jobCml:
          type:
          - object
          - 'null'
          description: '**OPTIONAL**: Job CML (Contributor Markup Language) configuration.'
          example: null
        jobFilter:
          type:
          - object
          - 'null'
          description: '**OPTIONAL**: Job data filtering configuration.'
          example: null
        jobCrowd:
          type:
          - object
          - 'null'
          description: '**OPTIONAL**: Job crowd/contributor settings.'
          example: null
        testQuestionSettings:
          type:
          - object
