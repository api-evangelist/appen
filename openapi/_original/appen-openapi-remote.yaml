  /v3/project-flow/projects/internalcontributor/add-contributors-to-existing-group:
    post:
      tags:
        - Internal Contributors
      summary: Add contributors to existing contributor group
      description: |
        Add existing internal contributors to an already existing contributor group. This API allows you to expand 
        contributor groups by adding more members without creating new groups.
        
        **Features:**
        - Add multiple contributors to an existing group in a single operation
        - Automatic validation of contributor IDs against existing internal contributors
        - Group membership validation to ensure the group exists in the specified team
        - Bulk contributor assignment for efficient group management
        
        
        **Note:**
        - All contributor IDs must exist as internal contributors in the specified team
        - The target group must exist and belong to the specified team
        - Contributors cannot be added to the same group multiple times
        
        **Response Statuses:**
        - `NEWLY_ADDED`: Contributors were successfully added to the group
        - `ALREADY_EXISTS`: Contributors were already part of the group
        - The response may contain both statuses when some contributors are new and others already exist

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
                - contributorIds
              properties:
                groupId:
                  type: string
                  description: The contributor group identifier (e.g., "d7476e6d-d2ab-421f-9b7c-0accdee0fd77")
                  example: "d7476e6d-d2ab-421f-9b7c-0accdee0fd77"
                contributorIds:
                  type: array
                  items:
                    type: string
                  description: List of contributor IDs to add to the group (e.g., ["a2c5661b-0045-453a-9a90-aead93fab45a", "8a2d267e-7629-4dc3-a5ef-a7dd8604338e"])
                  example: ["a2c5661b-0045-453a-9a90-aead93fab45a", "8a2d267e-7629-4dc3-a5ef-a7dd8604338e"]
            example:
              groupId: "d7476e6d-d2ab-421f-9b7c-0accdee0fd77"
              contributorIds: ["a2c5661b-0045-453a-9a90-aead93fab45a", "8a2d267e-7629-4dc3-a5ef-a7dd8604338e"]
