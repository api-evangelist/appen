  /v3/project-flow/projects/units:
    post:
      tags:
        - Route Units
      summary: List units in a project
      description: |
        Retrieves a paginated list of units that match the specified filters. This endpoint supports filtering, sorting, and pagination to help you query units within a project. 
        The filterModel in the request body can be used to specify job status values. 
        
        **Supported jobStatus Values**
        - NEW
        - JUDGABLE 
        - SUBMITTED
        - WORKING 
        - ABANDONED 

      operationId: listProjectUnits
      parameters:
        - name: projectId
          in: query
          required: true
          description: The project ID to retrieve units from
          schema:
            type: string
            format: uuid
          example: "faecd4fa-683f-402e-b7ea-8a904ae92021"
        - name: teamId
          in: query
          required: true
          description: The team ID that owns the project
          schema:
            type: string
            format: uuid
          example: "f6c0b8cb-de69-495c-980b-2b0e0a6ca288"
      requestBody:
        required: true
        description: |
          Request body for filtering, sorting, and paginating units. The includeFields parameter is automatically set by the API to return only jobStatus, unitId, and source._golden fields.
        content:
          application/json:
            schema:
              type: object
              required:
                - startRow
                - endRow
              properties:
                startRow:
                  type: integer
                  description: Starting row index for pagination (0-based)
                  example: 0
                endRow:
                  type: integer
                  description: Ending row index for pagination (inclusive)
                  example: 29
                filterModel:
                  type: object
                  description: |
                    Map of column filters. Each key is a column name, and the value is a filter object.
                    Supported filter types include SET for filtering by specific values.
                  additionalProperties:
                    type: object
                    properties:
                      filterType:
                        type: string
                        example: "SET"
                      values:
                        type: array
                        items:
                          type: string
                        example: ["NEW"]
                  example:
                    jobStatus:
                      filterType: "SET"
                      values: ["NEW"]
                    datasetRowType:
                      filterType: "SET"
                      values: ["UNIT", ""]
                sortModel:
                  type: array
                  description: Array of sort models for ordering results
                  items:
                    type: object
                  example: []
                queryString:
                  type: string
                  description: Optional query string for text search
                  example: ""
            examples:
              minimal:
                summary: Minimal request (pagination only)
                value:
                  startRow: 0
                  endRow: 1
              full:
                summary: Full request with filters
                value:
                  startRow: 0
                  endRow: 29
                  filterModel:
                    jobStatus:
                      filterType: "SET"
                      values: ["NEW"]
                    datasetRowType:
                      filterType: "SET"
                      values: ["UNIT", ""]
                  sortModel: []
                  queryString: ""
      x-codeSamples:
        - lang: curl
          label: List Units in Project (Mandatory Fields Only)
          source: |
            curl -X POST "https://api.appen.com/v3/project-flow/projects/units?projectId=faecd4fa-683f-402e-b7ea-8a904ae92021&teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288" \
              -H "Authorization: Token token=<your-api-key>" \
              -H "Content-Type: application/json" \
              -d '{
                "startRow": 0,
                "endRow": 1
              }'
        - lang: curl
          label: List Units in Project (Full Example)
          source: |
            curl -X POST "https://api.appen.com/v3/project-flow/projects/units?projectId=faecd4fa-683f-402e-b7ea-8a904ae92021&teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288" \
            -H "Authorization: Token token=<your-api-key>" \
            -H "Content-Type: application/json" \
            -d '{
            "startRow": 0,
            "endRow": 29,
            "filterModel": {
              "jobStatus": {
                "filterType": "SET",
                "values": ["NEW"]
              },
              "datasetRowType": {
                "filterType": "SET",
                "values": ["UNIT", ""]
              }
            },
            "sortModel": [],
            "queryString": ""
            }'
        - lang: curl
          label: List Units in Project (With Golden Units filter)
          source: |
            curl -X POST "https://api.appen.com/v3/project-flow/projects/units?projectId=faecd4fa-683f-402e-b7ea-8a904ae92021&teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288" \
            -H "Authorization: Token token=<your-api-key>" \
