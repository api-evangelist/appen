  /v3/project-flow/projects/copy:
    post:
      tags:
        - Projects
      summary: Copy project
      description: |
        Copies an existing project into the specified team. The new project name must be provided.
        
        Note:
        - The jobs inside the copied project are expected to be in draft state.
        - The sample configuration in the job canvas is carried over from the origin project and QA quality settings are added by default.
        - Contributor details will not be added to the Jobcrowd of copied project.

        Validations applied by the Public API:
        - teamId: The ID must be a valid UUID, desired destination team that must correspond to an existing, accessible team.
        - originId: The ID must be a valid UUID, and the source project (the one being copied) must belong to an existing team that you have access to.
        - datasetType: If omitted or blank, defaults to `NO_ROWS`; only documented enum values are accepted.
      operationId: copyProject
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: |
            TeamId of the destination team where the copied project will be created (i.e., the team the new project will belong to). The teamId must exist; otherwise the request fails with "invalid teamId" (400).
          example: "f6c0b8cb-de69-495c-980b-2b0e0a6ca288"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - originId
                - name
              properties:
                originId:
                  type: string
                  format: uuid
                  description: ID of the project to copy from (required)
                  example: "8c3b9c7e-8a6f-4572-8c02-2d0cbf7b87e2"
                name:
                  type: string
                  description: Name of the new project (required)
                  example: "Copy of Source Project"
                description:
                  type: string
                  description: Description for the new project (optional)
                  example: "Copied from Source Project"
                datasetType:
                  type: string
                  description: |
                    Optional dataset type to attach during copy. Defaults to NO_ROWS if omitted or blank.
                    Allowed values: TEST_QUESTION, NEW_UNITS, ALL_UNITS, NO_ROWS.
                    Semantics:
                      - **TEST_QUESTION**: copy only test question units
                      - **NEW_UNITS**: copy units with no active segments and their related test questions
                      - **ALL_UNITS**: copy all units (including test questions)
                      - **NO_ROWS**: copy project structure only (no data)
                  enum: [TEST_QUESTION, NEW_UNITS, ALL_UNITS, NO_ROWS]
                  default: NO_ROWS
                  example: "NO_ROWS"
                isJobSettingCopyRequired:
                  type: boolean
                  description: Optional; whether to copy job-level configuration/settings. Defaults to false.
                  default: false
                  example: false
            example:
              originId: "8c3b9c7e-8a6f-4572-8c02-2d0cbf7b87e2"
              name: "Copy of Source Project"
              description: "Copied from Source Project"
              datasetType: "NO_ROWS"
              isJobSettingCopyRequired: false
      x-codeSamples:
        - lang: curl
          label: Copy project
          source: |
            curl --location 'https://api.appen.com/v3/project-flow/projects/copy?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288' \
            --header 'Authorization: Token token=<your-api-key>' \
            --header 'Content-Type: application/json' \
            --data '{
                "originId": "b7879688-6fd1-4a83-aba8-540e3e653df8",
                "name": "Copy of Source Project",
                "description": "Copied from Source Project",
                "datasetType": "NO_ROWS",
                "isJobSettingCopyRequired": false
            }'
      responses:
        '200':
          description: Project copied successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: "b7879688-6fd1-4a83-aba8-540e3e653df8"
                          name:
                            type: string
                            example: "Copy of Source Project"
                          displayId:
                            type: integer
                            example: 87482
                          description:
                            type: string
                            example: "Copied from Source Project"
                          status:
                            type: string
                            example: "ACTIVE"
                          teamId:
                            type: string
                            format: uuid
                            example: "f6c0b8cb-de69-495c-980b-2b0e0a6ca288"
                          createdAt:
                            type: string
                            format: date-time
                            example: "2025-07-09T02:08:47Z"
              example:
                message: "success"
                code: 200
                data:
                  id: "3a164aa3-e358-49d0-be7a-004c808af558"
                  "name": "Copy of Source Project"
                  displayId: 92987
                  "description": "Copied from Source Project"
                  status: "ACTIVE"
