                    type: object
                    description: Response data containing units and pagination information
                    properties:
                      units:
                        type: array
                        description: |
                          Array of unit objects. Each unit is represented as a map where keys are field names 
                          (e.g., "jobStatus", "unitId", "source._golden") and values are arrays of UnitValueDTO objects.
                        items:
