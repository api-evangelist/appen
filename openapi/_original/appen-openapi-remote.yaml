              "filterModel": {
                  "datasetRowType": {
                  "filterType": "SET",
                  "values": ["UNIT", ""]
                    },
                 "source._golden": {
                 "filterType": "SET",
                 "values": ["TRUE"]
                    }
                },
              "sortModel": [],
              "queryString": ""
                }'

      responses:
