  /v3/project-flow/projects/internalcontributor/assign-job:
    post:
      tags:
        - Internal Contributors
      summary: Assign contributors to a job
      description: |
        Assign one or more internal contributors to a specific job within a project. This operation creates the association 
        between contributors and jobs, enabling them to work on the specified job tasks.
        
        **Features:**
        - Bulk assignment of multiple contributors to a single job
        - Validates that contributors exist and are not already assigned to the job
        
        **Note:**
        - Contributors cannot be assigned to Data Collection (DC) jobs
        - DC jobs include both DATA_COLLECTION and DATA_COLLECTION_QA job types
        - Job ID must belong to the provided Project ID
        
        **Limitations**
        - Assigning a contributor group to a job will be released in the next version. 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - jobId
                - contributorIds
              properties:
                projectId:
                  type: string
                  description: The project identifier (e.g., "1eac32c6-165b-47f8-827e-400d2b137138")
                  example: "1eac32c6-165b-47f8-827e-400d2b137138"
                jobId:
                  type: string
                  description: The job identifier (e.g., "5483e81c-b31c-4549-bfaa-bbfe955ecc9a")
                  example: "5483e81c-b31c-4549-bfaa-bbfe955ecc9a"
                contributorIds:
                  type: array
                  items:
                    type: string
                  description: List of contributor IDs to assign (e.g., ["2b16b2ba-f9a6-470c-aa85-f2266a4ea05b", "6cd91478-a718-47ff-9ecf-e7011b68d786"])
                  example: ["2b16b2ba-f9a6-470c-aa85-f2266a4ea05b", "6cd91478-a718-47ff-9ecf-e7011b68d786"]
            example:
              projectId: "1eac32c6-165b-47f8-827e-400d2b137138"
              jobId: "5483e81c-b31c-4549-bfaa-bbfe955ecc9a"
              contributorIds: ["2b16b2ba-f9a6-470c-aa85-f2266a4ea05b", "6cd91478-a718-47ff-9ecf-e7011b68d786"]
