  /v3/project-flow/projects/internalcontributor/add-contributor:
    post:
      tags:
        - Internal Contributors
      summary: Add contributor to a team
      description: |
        Add a new internal contributor to the team's project resources. This creates a new contributor record that can 
        be assigned to jobs and organized into contributor groups.
        
        **Features:**
        - Creates a new contributor with email and name
        - Validates email format and uniqueness within the team
        - Contributor becomes available for job assignments immediately
        - Contributors can be added to groups after creation
        
        **Note:**
        - Email addresses must be unique.
        - Contributor names are limited to 255 characters

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: Contributor's email address
                name:
                  type: string
                  maxLength: 255
                  description: Contributor's name
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
          description: The team identifier
