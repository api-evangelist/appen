  /v3/jobs/pause:
    post:
      tags:
        - Jobs
      summary: Pause job
      description: |
        Temporarily stops a running job, pausing all new contributor assignments while preserving current progress. This allows you to halt work without losing completed annotations.

        **What Happens When You Pause:**
        - Job status changes from DRAFT to PAUSED
        - Contributors cannot start new assignments
        - No new units are distributed to contributors
        - All progress and judgments are preserved
      operationId: pauseJob
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Job identifier to pause
          example: "2b9ebe3d-1ff2-461d-a0c8-66e86b239b57"
      x-codeSamples:
        - lang: curl
          label: Pause Job
          source: |
            curl -X POST "https://api.appen.com/v3/jobs/pause?jobId=<jobId>" \
              -H "Authorization: Token token=<your-api-key>"
      responses:
        '200':
          description: Job paused successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobDTO'
              example:
                message: "success"
                code: 200
                data:
                  id: "2b9ebe3d-1ff2-461d-a0c8-66e86b239b57"
                  state: "PAUSED"
                  title: "Paused Job"
                traceId: "trace-123"
                time: "2025-07-09T03:19:22Z"
        '400':
          description: Bad request - Invalid job ID or job already paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_job_id:
                  summary: Invalid job ID
                  value:
                    timestamp: "2025-07-01T10:28:59.893+00:00"
                    status: 400
                    error: "Bad Request"
                    message: "Invalid job ID"
                    path: "/v3/jobs/pause"
                job_already_paused:
                  summary: Job already paused
                  value:
                    timestamp: "2025-07-01T10:28:59.893+00:00"
                    status: 400
                    error: "Bad Request"
                    message: "Job already paused"
                    path: "/v3/jobs/pause"
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: "2025-07-01T10:28:59.893+00:00"
                status: 403
                error: "Forbidden"
                message: "Access denied. Check your privileges."
                path: "/v3/jobs/pause"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: "2025-07-01T10:28:59.893+00:00"
                status: 500
                error: "Internal Server Error"
                message: "Failed to pause job"
                path: "/v3/jobs/pause"
      security:
        - TokenAuth: [ ]


  /v3/jobs/upload.json:
    post:
      tags:
        - Upload
      summary: Upload unit data to an existing project
      description: |
        Uploads a CSV file to an existing project. The API requires `projectId` and `fileName` as query parameters. Returns upload status and file metadata, including a status polling URL.
        
        **Supported Data Types:**
        - **Units**: Individual data rows for annotation tasks
        - **Unit Groups**: Collections of related units that can be processed together
        
        **Date Format Support:**
        Only CSV files with following date formats are supported:
        - `yyyy/MM/dd` (e.g., 2025/03/14)
        - `yyyy/MM/dd HH:mm:ss` (e.g., 2025/03/14 07:52:46)
        - `yyyy-MM-dd` (e.g., 2025-03-14)
        - `yyyy-MM-ddTHH:mm:ss` (e.g., 2025-03-14T07:52:46)
        
        The status of the upload can be checked by triggering the **[Get the status of an uploaded file/dataset API](#operation/getUploadStatus)**.
      operationId: uploadDatasetToProject
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
          description: Project identifier
          example: "eb4bba9b-1e0b-4565-a74b-0db3820b8d8c"
        - name: fileName
          in: query
          required: true
          schema:
            type: string
          description: Name of the file uploaded
          example: "abc.csv"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.appen.com/v3/jobs/upload.json?projectId=<projectId>&fileName=<fileName>" \
            -H "Authorization: Token token=<your-api-key>" \
            -H "Content-Type: text/csv" \
            -T "@/path/to/your/file.csv"
      responses:
        '201':
          description: DataSet Upload is Triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  details:
                    type: string
                    example: DATASET UPLOAD IS TRIGGERED. Please use Status Poll URL to check the upload status
                  fileId:
                    type: string
                    example: "26eaf8c2-a608-4f4d-aa5d-baebc489bc19"
                  projectId:
                    type: string
                    example: "eb4bba9b-1e0b-4565-a74b-0db3820b8d8c"
                  batchNum:
                    type: integer
                    example: 1
                  statusPollUrl:
                    type: string
                    example: "/jobs/upload/status?fileId=26eaf8c2-a608-4f4d-aa5d-baebc489bc19&teamId=d124fcdf-3707-4caf-babb-3da1f5f1ec1e"
                  teamId:
                    type: string
                    example: "d124fcdf-3707-4caf-babb-3da1f5f1ec1e"
                  fileName:
                    type: string
                    example: "abc.csv"
                  createdAt:
                    type: string
                    format: date-time
                    example: "2025-07-03T19:13:45.456074Z"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2025-07-03T19:21:23.743529Z"
        '400':
          description: Bad request - Missing file or invalid CSV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedFormat:
                  summary: Unsupported file format
                  value:
                    status: 400
                    errorCode: 2003
                    errorMessage: "Unsupported file format. Please upload a CSV file."
                    traceId: "4a4ce5fc11ccf8423f8fc55921d93f7b"
                    timestamp: "2025-07-07T06:30:14.774186Z"
                fileNotFound:
