  /v3/project-flow/projects/contributor/internalcontributor/upload:
    post:
      tags:
        - Internal Contributors
      summary: Upload internal contributors to a team
      description: |
        Upload a CSV file containing email and name to be added as internal contributors in a team.
        
        **Features:**
        - Bulk upload of internal contributors via CSV file
        - Automatic validation of email addresses and names
        
        **CSV File Format:**
        - Required columns: `email`, `name`
        - Supported formats: CSV
        - **Column Order**: The CSV column headers must be `email` and `name` with the same order, otherwise the request will be rejected
        
        **Sample CSV File**: 
        
        Download the sample CSV file: [sample-contributors.csv](https://qualityflow-api-docs.s3.us-east-1.amazonaws.com/adap/upload_contributor_sample_csv.xlsx)
        
        **Sample CSV Content:**
        ```csv
        email,name
        john.doe@example.com,John Doe
        jane.smith@example.com,Jane Smith
        mike.wilson@example.com,Mike Wilson
        sarah.jones@example.com,Sarah Jones
        ```
        
        **Important Notes:**
        - All email addresses must be unique within the team
        - Invalid email formats will be rejected
        - Empty or null names will be rejected

      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
          description: The team identifier
        - name: fileName
          in: query
          required: true
          schema:
            type: string
          description: Name of the CSV file being uploaded
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The CSV file content
      responses:
