                      - "datasetRowType"
                      - "segmentGroupId"
                      - "jobTitle"
                      - "jobAlias"
                      - "jobJudgmentsPerRow"
                      - "jobStatus"
                      - "jobType"
                      - "sourceFileBatchNumber"
                      - "rowNumber"
                      - "unitTagName"
                      - "unitSourceMd5"
                      - "createdAt"
                      - "judgmentsCollected"
                      - "unitSegmentType"
                      - "questionId"
                      - "source._UNIT_GROUP"
                      - "source.audio_annotation"
                      - "source.audio_name"
                      - "source.audio_url"
                      # Judgment View (JUDGMENT_DATA_SET) columns
                      - "latest.jobTitle"
                      - "latest.jobAlias"
                      - "latest.jobJudgmentsPerRow"
                      - "latest.jobCycleNumber"
                      - "latest.jobStatus"
                      - "latest.jobType"
                      - "latest.workerEmail"
                      - "latest.workerExternalId"
                      - "latest.workerId"
                      - "latest.workerGender"
                      - "latest.workerLanguage"
                      - "latest.lastAnnotatorEmail"
                      - "latest.lastAnnotatorExternalId"
                      - "latest.lastAnnotator"
                      - "latest.activeStatus"
                      - "latest.agreementScore"
                      - "latest.committedAt"
                      - "latest.createdAt"
                      - "latest.distributionStatus"
                      - "latest.expiresAt"
                      - "latest.flowStatus"
                      - "latest.judgmentRawJson"
                      - "latest.judgmentsCollected"
                      - "latest.qualityScore"
                      - "latest.replica"
                      - "latest.replicaGroupId"
                      - "latest.reservedAt"
                      - "latest.segmentSequence"
                      - "latest.updatedAt"
                      # Dynamic judgment output fields (latest.judgment.{output_field_name})
                      - "latest.judgment.*"
                      # Earliest judgment fields (earliest.*)
                      - "earliest.*"
                      # History fields (history.*)
                      - "history.*"
                  description: Array of column names to include in the download. Leave empty to include all columns.
                  example:
                    - "unitDisplayId"
                    - "datasetRowType"
                    - "segmentGroupId"
                    - "jobTitle"
                    - "jobStatus"
                    - "createdAt"
            examples:
              download_all_units_all_columns:
                summary: Download all units with all columns
                value:
                  unitIds: []
              download_specific_units_all_columns:
                summary: Download specific units with all columns
                value:
                  unitIds:
                    - "081e98cc-6f40-455d-9bb7-942c0afb75e1"
                    - "3c2dbdfb-5a9f-4c2d-8cb0-c09cf0eb74b1"
              download_specific_units_specific_columns:
                summary: Download specific units with specific columns
                value:
                  unitIds:
                    - "081e98cc-6f40-455d-9bb7-942c0afb75e1"
                    - "3c2dbdfb-5a9f-4c2d-8cb0-c09cf0eb74b1"
                  columns:
                    - "unitDisplayId"
                    - "datasetRowType"
                    - "segmentGroupId"
                    - "jobTitle"
                    - "jobStatus"
                    - "createdAt"
              download_all_units_specific_columns:
                summary: Download all units with specific columns
                value:
                  unitIds: []
                  columns:
                    - "unitDisplayId"
                    - "datasetRowType"
                    - "segmentGroupId"
                    - "jobTitle"
                    - "jobStatus"
                    - "createdAt"

