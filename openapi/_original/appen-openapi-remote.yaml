  /v3/project-flow/projects/upload-test-question:
    post:
      tags:
        - Test Questions
      summary: Upload Test Questions
      description: |
        Upload test questions from a CSV file to a specific job within a project. This endpoint accepts a CSV file containing test question data with required columns: {column1, _golden, *_gold, *_gold_reason , quiz_work_mode}. Use the returned status poll URL to check the upload status.
        
        **Sample CSV File**: 
        
        Download the sample CSV file: [sample-test-questions.csv](https://qualityflow-api-docs.s3.us-east-1.amazonaws.com/adap/sample-test-questions.csv)
        
        **Important Notes**: 
        1. Only units already present in the project dataset can be uploaded as test questions. Non-matching units are automatically filtered out. For example, uploading 10 units when only 5 exist in the dataset will result in only 5 test questions being added. Already uploaded test questions will not be uploaded again. 
        2. Contributor scores report can be downloaded from the "Download a job level report" tab using the job level report cURL with `type` parameter set to `contributor_scores_report`.
      operationId: uploadTestQuestions
      parameters:
        - name: fileName
          in: query
          required: true
          description: The name of the CSV file being uploaded.
          schema:
            type: string
            example: "testquestions.csv"
        - name: projectId
          in: query
          required: true
          description: The unique identifier of the project.
          schema:
            type: string
            format: uuid
            example: "f2d8e3f3-bab0-4bfb-9529-21d74748d0be"
