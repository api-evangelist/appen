  /v3/project-flow/projects/jobs/status:
    get:
      tags:
        - Jobs
      summary: Get job status
      description: |
        Retrieves the current status and progress metrics for a specific job.
        
        This endpoint provides comprehensive job progress information including:
        - **Completion percentage**: Overall job completion progress (0-100%)
        - **Unit statistics**: Total units and submitted units in the job
        - **Judgment statistics**: Total and submitted judgments for the job
        - **Test questions**: Total available test questions for the job
        
        **Supported Job Types:**
        - WORK jobs
        - QA jobs

      operationId: getJobStatus
      x-codeSamples:
        - lang: curl
          label: Get Job Status
          source: |
            curl -X GET "https://api.appen.com/v3/project-flow/projects/jobs/status?teamId=cf22e84f-06c8-4955-b626-1c47d245a176&jobId=db66f1e3-7260-45a8-b8c6-9359bbdbfd3f" \
              -H "Authorization: Token token=<your-api-key>"
      parameters:
        - name: teamId
          in: query
          required: true
          description: The unique identifier for your team
          schema:
            type: string
            format: uuid
            example: "cf22e84f-06c8-4955-b626-1c47d245a176"
        - name: jobId
          in: query
          required: true
          description: The unique identifier of the job to get status for
          schema:
            type: string
            format: uuid
            example: "db66f1e3-7260-45a8-b8c6-9359bbdbfd3f"
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - jobId
                  - jobTitle
                  - completionPercentage
                  - totalUnits
                  - submittedUnits
                  - totalJudgments
                  - submittedJudgments
                  - totalTestQuestions
                  - lastUpdated
                  - status
                  - message
                  - traceId
                  - timestamp
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: Unique identifier of the job
                    example: "db66f1e3-7260-45a8-b8c6-9359bbdbfd3f"
                  jobTitle:
                    type: string
                    description: Title of the job
                    example: "work"
                  completionPercentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Job completion percentage (0-100)
                    example: 50
                  totalUnits:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total number of units in the job
                    example: 8
                  submittedUnits:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Number of units that have been submitted/finalized
                    example: 4
                  totalJudgments:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Total number of judgments expected for the job
                    example: 17
                  submittedJudgments:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Number of judgments that have been submitted (COMMITTED status)
                    example: 8
                  totalTestQuestions:
                    type: integer
                    minimum: 0
                    description: Total number of available test questions for the job
                    example: 3
                  lastUpdated:
                    type: string
                    format: date-time
                    description: Timestamp when the status was last updated
                    example: "2025-10-29T04:00:48.659850Z"
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Response message
                    example: "Job status retrieved successfully"
                  traceId:
                    type: string
                    description: Unique trace ID for request tracking
                    example: "f05188f693ea9ad8b10c9d43e202e06f"
                  timestamp:
                    type: string
                    format: date-time
                    description: Response generation timestamp
                    example: "2025-10-29T04:00:48.662217Z"
              examples:
                successful_response:
                  summary: Successful job status response
                  value:
                    jobId: "db66f1e3-7260-45a8-b8c6-9359bbdbfd3f"
                    jobTitle: "work"
                    completionPercentage: 50
                    totalUnits: 8
                    submittedUnits: 4
                    totalJudgments: 17
                    submittedJudgments: 8
                    totalTestQuestions: 3
                    lastUpdated: "2025-10-29T04:00:48.659850Z"
                    status: 200
                    message: "Job status retrieved successfully"
                    traceId: "f05188f693ea9ad8b10c9d43e202e06f"
                    timestamp: "2025-10-29T04:00:48.662217Z"
