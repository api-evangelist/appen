  /v3/jobs/launch:
    post:
      tags:
        - Jobs
      summary: Launch & Resume/Run job
      description: |
        Activates a previously created job, making it available for contributors to work on. This transitions the job from PAUSE to RUNNING state and begins the actual annotation process.
        
        
        
        # Contributor Access URL Construction

        With this release, customers can now generate the Contributor Access URL programmatically.
        
        ### URL Structure
        ```
        https://account.appen.com/quality/tasks/{jobId}?secret={secret}
        ```

        ### Components
        - **Base URL**: `https://account.appen.com/quality/tasks/` (constant string)
        - **Job ID**: Returned in the response of the Create Job API (example: `2d215241-00bc-4453-bac3-449387a78190`)
        - **Secret**: Returned in the response of the Update Job Settings API (example: `xicPrChRfj28e7GLZiDykuTDQZqpJYv6QkBRLacU5bp4eE`)

        ### Example Construction
        ```
        https://account.appen.com/quality/tasks/2d215241-00bc-4453-bac3-449387a78190?secret=xicPrChRfj28e7GLZiDykuTDQZqpJYv6QkBRLacU5bp4eE
        ```
        
        
        **Limitations:**
        - Jobs can be launched only in ‘Work’ mode but NOT in either ‘Quiz’ mode / ‘Quiz+Work’ mode. Test Question feature will be supported in the subsequent releases,then the Jobs can be launched in all modes.
        - Management of Internal/External contributors through crowd type will be supported in the subsequent releases.
      operationId: launchJob
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Job identifier to launch
          example: "46deb496-749a-41de-8af8-d4b5890aa484"
      x-codeSamples:
        - lang: curl
          label: Launch & Resume/Run job
          source: |
            curl -X POST "https://api.appen.com/v3/jobs/launch?jobId=<jobId>" \
              -H "Authorization: Token token=<your-api-key>"
      responses:
        '200':
          description: Job launched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobDTO'
              example:
                message: "success"
                code: 200
                data:
                  id: "46deb496-749a-41de-8af8-d4b5890aa484"
                  state: "RUNNING"
                  title: "Launched Job"
                traceId: "trace-123"
                time: "2025-07-09T03:19:22Z"
        '400':
          description: Bad request - Invalid job ID or job already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_job_id:
                  summary: Invalid job ID
                  value:
                    timestamp: "2025-07-01T10:28:59.893+00:00"
                    status: 400
                    error: "Bad Request"
                    message: "Invalid job ID"
                    path: "/v3/jobs/launch"
                job_settings_not_saved:
                  summary: Job settings not saved
                  value:
                    timestamp: "2025-07-01T10:28:59.893+00:00"
                    status: 400
                    error: "Bad Request"
                    message: "Job settings not saved"
                    path: "/v3/jobs/launch"
                job_already_running:
                  summary: Job already running
                  value:
                    timestamp: "2025-07-01T10:28:59.893+00:00"
                    status: 400
                    error: "Bad Request"
                    message: "Job already running"
                    path: "/v3/jobs/launch"
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: "2025-07-01T10:28:59.893+00:00"
                status: 403
                error: "Forbidden"
                message: "Access denied. Check your privileges."
                path: "/v3/jobs/launch"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: "2025-07-01T10:28:59.893+00:00"
                status: 500
                error: "Internal Server Error"
                message: "Failed to launch job"
                path: "/v3/jobs/launch"
      security:
        - TokenAuth: [ ]



  /v3/jobs/download.csv:
    post:
      tags:
        - Download

      summary: Download a job-level/project-level report.
      description: |
        **Download a report from a job/project.**
        
        - **Job-level reports**: Use `jobId` parameter to download reports for a specific job.
        - **Project-level reports**: Use `projectId` parameter to download reports for an entire project.
        - **Aggregated reports**: Use request body to specify aggregation settings.

        - **Either `jobId` or `projectId` must be provided, but not both.**
        
        **Response Behavior:**
        - **202 Response**: Report download is in progress. **You must call this same endpoint again with the exact same query parameters** (`type`, `filename`, `jobId` or `projectId`) to check the status. Repeat the request every 2-5 seconds until you receive a 200 response.
        - **200 Response**: Report is ready and is downloaded to the path where the curl is executed. The file content is streamed directly in the response body. **No separate URL fetch is needed** - the file is streamed directly when ready.
        
        **Note**: 
        - **curl users**: Files are automatically saved using the `-o` flag
        - **Postman/API tool users**: Need to use the "Save response to file" option like below
      
      
      

      operationId: downloadCsvFile
      parameters:

        - name: jobId
          in: query
          required: false

          description: |
            The unique identifier of the job to download the report for.
            
            **This 'jobId' parameter must be only used when downloading Job Level Reports**
          schema:
            type: string
            example: a7b1e93f-ce11-462b-bd8f-259ad6966609


        - name: projectId
          in: query
          required: false
          description: |
            The unique identifier of the project to download the report for.
            
            **This 'projectId' parameter must be only used when downloading Project Level Reports**
          schema:
            type: string
            example: 2913c9d4-f894-4900-9313-947f2dbc63e9
        - name: type
          in: query
          required: true
          description: |
            Specifies the type of report to generate or download. Valid values include:
            
            
            **Job-level report types:**
            - **full** – Returns the Full report containing every judgment.
            - **json** – Returns the JSON report containing both aggregated responses and individual judgments.
            - **aggregated** – Returns the Aggregated report with custom aggregation settings (requires request body).
            - **workset** – Returns the Contributor (Workset) report.
            - **source** – Returns a CSV of the source data uploaded to the job.
            - **ai_detector_report_contributor_level** - Returns an AI Detector Report at Contributor Level
            - **ai_detector_report_unit_level** - Returns an AI Detector Report at Unit Level
            - **test_question_report_contributor_level** - Returns Test Question Report at Contributor Level
            - **gold_report** - Returns Test Question Report with selected or all units
            - **k_alpha_report** - Returns Inter Annotator Agreement (K - Alpha) Report
            - **contributor_scores_report** - Returns the Contributor Scores Report.
            
            ** **
            
            **Project-level report types:**
            - **job_daily_report_project_level** – Returns the Job Daily report for the entire project
            - **contributor_report_project_level** – Returns the Contributor report for the entire project
            - **source_report_project_level** – Returns the Source report for the entire project
            - **json_report_project_level** – Returns the JSON report for the entire project
          

          schema:
            type: string

        - name: filename
          in: query
          required: true
          description: The name of the output file you would like to specify
          schema:
            type: string
            example: report.csv

      requestBody:
        required: false
        description: |
          Request body settings for different report types.
          
          **For `type=aggregated`**: Aggregated results settings that allow you to specify how multiple contributors judgments will be summarized in the aggregated report of a job.
          
          **For `type=gold_report`**: Test question report settings that allow you to specify which units to include in the test question report.
          
          
          **📋 Required Configuration:**
          You MUST select one aggregation algorithm for EACH judgment column in the request body. For example:
          - Select one algorithm for `_meta` column
          - Select one algorithm for `ask_question_here` column
          
          **Available Algorithms:**
          - **AGG** (Best Answer) 
          - **AGG_X** (Top # Answers) 
          - **CAGG_X** (Confidence Score)
          - **ALL** (All Answers)
          - **AVG** (Numeric Average) 
          
          **⚠️ Parameter Requirements:**
          - If you select **AGG_X**, you MUST specify `numberOfAnswers` parameter
          - If you select **CAGG_X**, you MUST specify `minimumConfidence` parameter. **minimumConfidence** value should range between 0 and 1.
          - For **AGG**, **ALL**, and **AVG**, no parameters are needed

        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Request body for aggregated reports (type=aggregated)
                  properties:
                    judgmentColumnAggregation:
                      type: array
                      description: Array of aggregation settings for each judgment column. You MUST include ALL judgment columns in the request body, each with its own aggregation algorithm.
                      items:
                        type: object
                        required:
                          - judgmentColumn
                          - aggregationAlgorithm
                        properties:
                          judgmentColumn:
                            type: string
                            description: The name of the judgment column to aggregate. Must be one of the judgment columns from your job (e.g., "_meta", "ask_question_here")
                            example: "_meta"
                          aggregationAlgorithm:
                            type: string
                            description: The aggregation algorithm to use for this column
                            enum: [ AGG, AGG_X, CAGG_X, ALL, AVG ]
                            example: "AGG"
                          parameter:
                            type: object
                            description: Parameters for the aggregation algorithm (**REQUIRED for AGG_X and CAGG_X, NOT NEEDED for AGG, ALL, AVG**)
                            properties:
                              numberOfAnswers:
                                type: string
                                description: |
                                  **REQUIRED for AGG_X**: Number of top answers to include (positive integer)
                                example: "5"
                              minimumConfidence:
                                type: string
                                description: |
                                  **REQUIRED for CAGG_X**: Minimum confidence threshold between 0.0 and 1.0
                                example: "0.8"
                            example:
                              numberOfAnswers: "5"
                - type: object
                  description: Request body for test question reports (type=gold_report)
                  properties:
                    addTestQuestionVO:
                      type: array
                      description: Array of test question units to include in the report. Required when `type=gold_report`. Use empty array `[]` to include all units.
                      items:
                        type: object
                        required:
                          - unitId
                          - unitDisplayId
                        properties:
                          unitId:
                            type: string
                            description: The unique identifier of the unit
                            example: "abcb4175-843d-4db2-a596-61e39e60d1cc"
                          unitDisplayId:
                            type: string
                            description: The display identifier of the unit
                            example: "1_1"
              example:
                judgmentColumnAggregation:
                  - judgmentColumn: "_meta"
                    aggregationAlgorithm: "AGG"
                  - judgmentColumn: "ask_question_here"
                    aggregationAlgorithm: "AGG_X"
                    parameter:
                      numberOfAnswers: "5"


      x-codeSamples:
        - lang: curl cURL
          label: Job-level Report cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=full&filename=<file_name>&jobId=<job_id>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -o <file_name_for_download>.zip \
            -w "\n\n===== RESPONSE INFO =====\nHTTP Status: %{http_code}\nContent-Type: %{content_type}\nSize: %{size_download} bytes\n========================\n"

        - lang: curl
          label: Project-level Report cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=job_daily_report_project_level&filename=<file_name>>&projectId=<project_id>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -o <file_name_for_download>.zip \
            -w "\n\n===== RESPONSE INFO =====\nHTTP Status: %{http_code}\nContent-Type: %{content_type}\nSize: %{size_download} bytes\n========================\n"

        - lang: curl
          label: Aggregated Job-Level Report - Confidence Score and Top Answers cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=aggregated&filename=<file_name>&jobId=<job_id>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -H 'Content-Type: application/json' \
            -d '{
              "judgmentColumnAggregation": [
                {
                  "judgmentColumn": "_meta",
                  "aggregationAlgorithm": "AGG_X",
                  "parameter": {"numberOfAnswers": "5"}
                },
                {
                  "judgmentColumn": "ask_question_here",
                  "aggregationAlgorithm": "CAGG_X",
                  "parameter": {"minimumConfidence": "0.5"}
                }
              ]
            }' \
            -o <file_name_for_download>.zip \
            -w "\n\n===== RESPONSE INFO =====\nHTTP Status: %{http_code}\nContent-Type: %{content_type}\nSize: %{size_download} bytes\n========================\n"

        - lang: curl
          label: Aggregated Job-Level Report - Best Answer and Confidence Score cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=aggregated&filename=<file_name>&jobId=<job_id>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -H 'Content-Type: application/json' \
            -d '{
              "judgmentColumnAggregation": [
                {
                  "judgmentColumn": "_meta",
                  "aggregationAlgorithm": "AGG"
                },
                {
                  "judgmentColumn": "ask_question_here",
                  "aggregationAlgorithm": "CAGG_X",
                  "parameter": {"minimumConfidence": "0.5"}
                }
              ]
            }' \
            -o <file_name_for_download>.zip \
            -w "\n\n===== RESPONSE INFO =====\nHTTP Status: %{http_code}\nContent-Type: %{content_type}\nSize: %{size_download} bytes\n========================\n"

        - lang: curl
          label: Download Gold Report with Selected Units cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=gold_report&filename=gold_report.csv&jobId=<jobId>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -H 'Content-Type: application/json' \
            -d '{
              "addTestQuestionVO": [
                  {
               "unitId": "2ceaf41e-2830-4bae-8776-fa5bfce66462",
               "unitDisplayId": "1_1"
                }
                ]
                }'


        - lang: curl
          label: Download Gold Report with All Units cURL
          source: |
            curl -L -X POST 'https://api.appen.com/v3/jobs/download.csv?type=gold_report&filename=gold_report.csv&jobId=<jobId>' \
            -H 'Authorization: Token token=<your-api-key>' \
            -H 'Content-Type: application/json' \
            -d '{
            "addTestQuestionVO":[]
            }'


      responses:
        '200':
          description: Download completed and URL available for download
          headers:
            Location:
              description: Direct URL to download the completed report
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                description: Curl transfer statistics and response information output
              example: |
                % Total    % Received % Xferd  Average Speed   Time    Time     Time  Current
                                 Dload  Upload   Total   Spent    Left  Speed
                100 19887    0 19866  100    21   7139      7  0:00:03  0:00:02  0:00:01  7145


