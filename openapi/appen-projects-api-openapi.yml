openapi: 3.2.0
info:
  title: Appen AI Data Annotation Platform (ADAP) Projects API
  description: '# Introduction


    The Appen AI Data Annotation Platform (ADAP) APIs offer a structured, automated approach to ensure high-quality data labeling on a scale.'
servers:
- url: https://api.appen.com/
  description: Production environment
security:
- TokenAuth: []
tags:
- name: Projects
  description: Project management operations for organizing and structuring your data annotation workflows.
paths:
  /v3/project-flow/projects:
    post:
      tags:
      - Projects
      summary: Create a new project
      description: 'Creates a new project within a team. Project is a container that organizes and structures your data annotation workflows.

        Projects serve as the foundation for organizing related jobs, units, and data within your team.

        Each project belongs to a specific team and can contain multiple jobs.

        Projects have unique names that help you organize and identify different annotation initiatives.

        Think of a project as a workspace where you can group related annotation tasks, manage data uploads,

        and coordinate quality assurance workflows across multiple jobs.


        **Required Parameters:**

        - `teamId`: The unique identifier of the team that will own this project

        - `name`: A unique project name (must not duplicate existing project names in your team)


        **Optional Parameters:**

        - `description`: Additional details about the project purpose or scope'
      operationId: createProject
      parameters:
      - name: teamId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Team under which project is made
        example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
      x-codeSamples:
      - lang: curl
        label: Create Project
        source: "curl -X POST \"https://api.appen.com/v3/project-flow/projects?teamId=<teamId>\" \\\n  -H \"Authorization: Token token=<your-api-key>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"name\": \"Your Project Name\",\n    \"description\": \"Your Project Description (Optional)\"\n  }'\n"
      responses:
        '200':
          description: Project created successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: b7879688-6fd1-4a83-aba8-540e3e653df8
                        name:
                          type: string
                          example: Your Project Name
                        displayId:
                          type: integer
                          example: 87481
                        description:
                          type: string
                          example: Your Project Description (Optional)
                        status:
                          type: string
                          example: ACTIVE
                        teamId:
                          type: string
                          format: uuid
                          example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
                        createdAt:
                          type: string
                          format: date-time
                          example: '2025-07-09T02:08:47Z'
                        createdBy:
                          type: string
                          example: user-123
                        version:
                          type: integer
                          example: 0
                        projectType:
                          type: string
                          example: PROJECT
                        projectAccessLevel:
                          type: string
                          example: TEAM
              example:
                message: success
                code: 200
                data:
                  id: b7879688-6fd1-4a83-aba8-540e3e653df8
                  name: ' before demo jul 9'
                  displayId: 87481
                  description: Your Project Description (Optional)
                  status: ACTIVE
                  teamId: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
                  createdAt: '2025-07-09T02:08:47Z'
                  createdBy: user-123
                  version: 0
                  projectType: PROJECT
                  projectAccessLevel: TEAM
                traceId: trace-123
                time: '2025-07-09T02:08:47Z'
        '400':
          description: Bad request - Missing required fields or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_required_fields:
                  summary: Missing required fields
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Missing required fields
                    path: /v3/project-flow/projects
                duplicate_name:
                  summary: Project name already exists
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Project name already exists
                    path: /v3/project-flow/projects
        '403':
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 403
                error: Forbidden
                message: Access denied. You may not have permission to create projects.
                path: /v3/project-flow/projects
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 500
                error: Internal Server Error
                message: Failed to create project
                path: /v3/project-flow/projects
      security:
      - TokenAuth: []
  /v3/project-flow/projects/copy:
    post:
      tags:
      - Projects
      summary: Copy project
      description: 'Copies an existing project into the specified team. The new project name must be provided.


        Note:

        - The jobs inside the copied project are expected to be in draft state.

        - The sample configuration in the job canvas is carried over from the origin project and QA quality settings are added by default.

        - Contributor details will not be added to the Jobcrowd of copied project.


        Validations applied by the Public API:

        - teamId: The ID must be a valid UUID, desired destination team that must correspond to an existing, accessible team.

        - originId: The ID must be a valid UUID, and the source project (the one being copied) must belong to an existing team that you have access to.

        - datasetType: If omitted or blank, defaults to `NO_ROWS`; only documented enum values are accepted.'
      operationId: copyProject
      parameters:
      - name: teamId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: 'TeamId of the destination team where the copied project will be created (i.e., the team the new project will belong to). The teamId must exist; otherwise the request fails with "invalid teamId" (400).

          '
        example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - originId
              - name
              properties:
                originId:
                  type: string
                  format: uuid
                  description: ID of the project to copy from (required)
                  example: 8c3b9c7e-8a6f-4572-8c02-2d0cbf7b87e2
                name:
                  type: string
                  description: Name of the new project (required)
                  example: Copy of Source Project
                description:
                  type: string
                  description: Description for the new project (optional)
                  example: Copied from Source Project
                datasetType:
                  type: string
                  description: "Optional dataset type to attach during copy. Defaults to NO_ROWS if omitted or blank.\nAllowed values: TEST_QUESTION, NEW_UNITS, ALL_UNITS, NO_ROWS.\nSemantics:\n  - **TEST_QUESTION**: copy only test question units\n  - **NEW_UNITS**: copy units with no active segments and their related test questions\n  - **ALL_UNITS**: copy all units (including test questions)\n  - **NO_ROWS**: copy project structure only (no data)\n"
                  enum:
                  - TEST_QUESTION
                  - NEW_UNITS
                  - ALL_UNITS
                  - NO_ROWS
                  default: NO_ROWS
                  example: NO_ROWS
                isJobSettingCopyRequired:
                  type: boolean
                  description: Optional; whether to copy job-level configuration/settings. Defaults to false.
                  default: false
                  example: false
            example:
              originId: 8c3b9c7e-8a6f-4572-8c02-2d0cbf7b87e2
              name: Copy of Source Project
              description: Copied from Source Project
              datasetType: NO_ROWS
              isJobSettingCopyRequired: false
      x-codeSamples:
      - lang: curl
        label: Copy project
        source: "curl --location 'https://api.appen.com/v3/project-flow/projects/copy?teamId=f6c0b8cb-de69-495c-980b-2b0e0a6ca288' \\\n--header 'Authorization: Token token=<your-api-key>' \\\n--header 'Content-Type: application/json' \\\n--data '{\n    \"originId\": \"b7879688-6fd1-4a83-aba8-540e3e653df8\",\n    \"name\": \"Copy of Source Project\",\n    \"description\": \"Copied from Source Project\",\n    \"datasetType\": \"NO_ROWS\",\n    \"isJobSettingCopyRequired\": false\n}'\n"
      responses:
        '200':
          description: Project copied successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: b7879688-6fd1-4a83-aba8-540e3e653df8
                        name:
                          type: string
                          example: Copy of Source Project
                        displayId:
                          type: integer
                          example: 87482
                        description:
                          type: string
                          example: Copied from Source Project
                        status:
                          type: string
                          example: ACTIVE
                        teamId:
                          type: string
                          format: uuid
                          example: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
                        createdAt:
                          type: string
                          format: date-time
                          example: '2025-07-09T02:08:47Z'
              example:
                message: success
                code: 200
                data:
                  id: 3a164aa3-e358-49d0-be7a-004c808af558
                  name: Copy of Source Project
                  displayId: 92987
                  description: Copied from Source Project
                  status: ACTIVE
                  unitSegmentType: UNIT_ONLY
                  teamId: f6c0b8cb-de69-495c-980b-2b0e0a6ca288
                  createdAt: '2025-09-09T09:19:46.902968Z'
                  createdBy: 225b4107-ca93-41e4-ab25-5f0628c8e518
                  version: 0
                  projectType: PROJECT
                  projectAccessLevel: TEAM
                traceId: 34ad19e2-6537-4ac7-b0a2-2fdb795c3e19
                time: '2025-09-09T09:19:46.986401Z'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                origin_required:
                  summary: originId missing or blank
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: originId is required
                    path: /v3/project-flow/projects/copy
                name_required:
                  summary: name missing or blank
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: name cannot be empty
                    path: /v3/project-flow/projects/copy
                dataset_type_invalid:
                  summary: datasetType invalid
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: 'datasetType invalid: expected one of {TEST_QUESTION, NEW_UNITS, ALL_UNITS, NO_ROWS}'
                    path: /v3/project-flow/projects/copy
                teamid_invalid:
                  summary: teamId invalid
                  value:
                    timestamp: '2025-07-01T10:28:59.893+00:00'
                    status: 400
                    error: Bad Request
                    message: Invalid teamId
                    path: /v3/project-flow/projects/copy
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 403
                error: Forbidden
                message: Forbidden
                path: /v3/project-flow/projects/copy
        '404':
          description: Origin project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 404
                error: Not Found
                message: origin project not found or inaccessible
                path: /v3/project-flow/projects/copy
        '409':
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 409
                error: Conflict
                message: Project name already exists in team
                path: /v3/project-flow/projects/copy
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 422
                error: Unprocessable Entity
                message: 'clone flows failed: <details>'
                path: /v3/project-flow/projects/copy
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2025-07-01T10:28:59.893+00:00'
                status: 500
                error: Internal Server Error
                message: Internal Server Error
                path: /v3/project-flow/projects/copy
      security:
      - TokenAuth: []
  /v3/project-flow/projects/project-status:
    security:
    - TokenAuth: []
    get:
      tags:
      - Projects
      summary: Get project status
      description: 'Returns project name, description, status and high-level statistics for a given project.


        Typical use cases:

        - Display project progress and units submission statistics

        - List active jobs (id, title, state) for the project'
      operationId: getProjectStatusV3
      parameters:
      - name: projectId
        in: query
        required: true
        description: Unique identifier of the project to fetch
        schema:
          type: string
          format: uuid
      x-codeSamples:
      - lang: curl
        label: Get project status cURL
        source: 'curl --location ''https://api.appen.com/v3/project-flow/projects/project-status?projectId=<PROJECT_ID>'' \

          --header ''Authorization: Token token=<your-api-key>'' \

          --header ''Accept: application/json''

          '
      responses:
        '200':
          description: completed successfully. Response contains the project details.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        projectName:
                          type: string
                          description: Name of the project
                        projectDescription:
                          type:
                          - string
                          - 'null'
                          description: Description of the project
                        dataSummaryDTO:
                          type: object
                          description: Summary of project data progress and counts
                          properties:
                            projectId:
                              type: string
                              format: uuid
                            lastUpdated:
                              type: string
                              format: date-time
                            totalUnits:
                              type: integer
                              format: int64
                            submittedUnits:
                              type: integer
                              format: int64
                            totalUnitGroups:
                              type: integer
                              format: int64
                            submittedUnitGroups:
                              type: integer
                              format: int64
                            totalJudgments:
                              type: integer
                              format: int64
                            unitSummary:
                              type: object
                              additionalProperties:
                                type: integer
                                format: int64
                            judgmentSummary:
                              type: object
                              additionalProperties:
                                type: integer
                                format: int64
                            audioTranscriptionTotalDuration:
