  /v3/project-flow/projects/update-project-settings:
    put:
      tags:
      - Projects
      summary: Update project settings
      description: 'Updates project name and/or description for a given project.


        **Features:**

        - Update project name (1-255 characters)

        - Update project description (up to 500 characters, can be empty to clear)

        - Both name and description can be updated in a single API request

        - At least one field (name or description) must be provided in the API request


        **Validation:**

        - Project ID is required

        - Name must be 1-255 characters if provided

        - Description must not exceed 500 characters if provided

        - Description can be empty string to clear existing description'
      operationId: updateProjectSettingsV3
      parameters:
      - name: teamId
        in: query
        required: true
        description: Unique identifier of the team that owns the project
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - projectId
              properties:
                projectId:
                  type: string
                  format: uuid
                  description: Unique identifier of the project to update
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New project name (optional, but at least one of name or description must be provided)
                description:
                  type: string
                  maxLength: 500
                  description: New project description (optional, can be empty string to clear, but at least one of name or description must be provided)
      x-codeSamples:
      - lang: curl
        label: Update both project name and description cURL
        source: "curl -X PUT 'https://api.appen.com/v3/project-flow/projects/update-project-settings?teamId=<TEAM_ID>' \\\n-H 'Content-Type: application/json' \\\n-H 'Authorization: Token token=<your-api-key>' \\\n-d '{\n  \"projectId\": \"<PROJECT_ID>\",\n  \"name\": \"Updated Project Name\",\n  \"description\": \"Updated project description\"\n}'\n"
      - lang: curl
        label: Update name only cURL
        source: "curl -X PUT 'https://api.appen.com/v3/project-flow/projects/update-project-settings?teamId=<TEAM_ID>' \\\n-H 'Content-Type: application/json' \\\n-H 'Authorization: Token token=<your-api-key>' \\\n-d '{\n  \"projectId\": \"<PROJECT_ID>\",\n  \"name\": \"Updated Project Name\"\n}'\n"
      - lang: curl
        label: Update description only cURL
        source: "curl -X PUT 'https://api.appen.com/v3/project-flow/projects/update-project-settings?teamId=<TEAM_ID>' \\\n-H 'Content-Type: application/json' \\\n-H 'Authorization: Token token=<your-api-key>' \\\n-d '{\n  \"projectId\": \"<PROJECT_ID>\",\n  \"description\": \"Updated project description\"\n}'\n"
      responses:
        '200':
          description: Project settings updated successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Response'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Project identifier
                        projectName:
                          type: string
                          description: Updated project name
                        projectDescription:
                          type: string
                          description: Updated project description (may be empty string)
                        displayId:
                          type: integer
                          format: int64
                          description: Display ID of the project
                        teamId:
                          type: string
                          format: uuid
                          description: Team identifier
                        version:
                          type: integer
                          description: Version number of the project
                        createdAt:
                          type: string
                          format: date-time
                          description: Creation timestamp
                        createdBy:
                          type: string
                          description: User ID who created the project
                        projectType:
                          type: string
                          description: Type of the project
              examples:
                success_both_updated:
                  summary: Both name and description updated
                  value:
                    message: Project name and description have been updated successfully
                    code: 200
                    data:
                      id: e457bb2f-1f75-46a2-b78a-c994caf06ccd
                      projectName: Updated Project Name
                      projectDescription: Updated project description
