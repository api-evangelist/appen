- aid: appen:appen-download-api
  name: Appen Download API
  description: "Generate and download reports for either a single job or an entire project, and download\
    \ datasets from projects.\n\n- **Choose scope with exactly one of:**\n  - jobId: download a Job-level\
    \ report\n  - projectId: download a Project-level report or dataset\n  (Do not send both.)\n\n- **Required\
    \ query parameters:**\n  - type: the report you want to generate or dataset to download\n  - filename:\
    \ the output file name (e.g., report.csv)\n\n- **How it works:**\n  - When you trigger the API for\
    \ the first time, the API returns 202 (in progress).\n  - **You must call the same endpoint again\
    \ with the exact same query parameters** to check the status. Repeat the request every 2-5 seconds\
    \ until you receive a 200 response.\n  - When the report is ready for download, the API returns 200\
    \ and streams the file directly in the response body.\n  - **No separate URL fetch is needed** - the\
    \ file content is streamed directly when ready (200 response).\n  - The file is automatically saved\
    \ to the path specified in your curl `-o` flag or your API tool's save location. \n\n- **Supported\
    \ report types:**\n  **Job-level (use jobId):**\n    - full: All individual judgments\n    - json:\
    \ JSON report with aggregated and raw judgments\n    - aggregated: Aggregated results (requires request\
    \ body; see below)\n    - workset: Contributor (Workset) report\n    - source: Original source data\
    \ uploaded to the job\n    - ai_detector_report_contributor_level\n    - ai_detector_report_unit_level\n\
    \    - test_question_report_contributor_level\n    - k_alpha_report: Inter-annotator agreement (Krippendorff’s\
    \ alpha)\n    - contributor_scores_report: Contributor Scores Report\n\n  **Project-level (use projectId):**\n\
    \    - job_daily_report_project_level\n    - contributor_report_project_level\n    - source_report_project_level\n\
    \    - json_report_project_level\n\n  **Dataset Download (use projectId):**\n    - DATA_SET: Unit\
    \ View dataset with customizable unit selection and column filtering\n    - JUDGMENT_DATA_SET: Judgment\
    \ View dataset with customizable unit selection and column filtering\n    - Supports filtering by\
    \ unit IDs and column selection\n    - Optional filter support with filterName and userId/akonId parameters\n\
    \n- **Aggregated reports (type=aggregated, Job-level only):**\n  - Provide a request body with aggregation\
    \ rules for every judgment column:\n    judgmentColumnAggregation: [\n      { judgmentColumn, aggregationAlgorithm,\
    \ parameter? }\n    ]\n  - aggregationAlgorithm must be one of:\n    - AGG (Best Answer)\n    - AGG_X\
    \ (Top # Answers) → requires parameter.numberOfAnswers\n    - CAGG_X (Confidence Score) → requires\
    \ parameter.minimumConfidence (0–1)\n    - ALL (All Answers)\n    - AVG (Numeric Average)\n  - Example:\
    \ choose one algorithm per column (e.g., \"_meta\", \"ask_question_here\").\n\n- **File format:**\n\
    \  - Most types return CSV files; type=json returns a JSON file.\n  - The final file name uses the\
    \ provided filename parameter.\n\n- **Authentication:**\n  - Authorization: Token token=your-api-key\n\
    \n- **Responses:**\n  - 200: DONE with downloadableUrl (and Location header)\n  - 202: Report generation\
    \ in progress\n  - 400/403/404/500: Error with details"
  humanURL: https://developer.appen.com/open-api.yaml
  baseURL: https://api.appen.com
  tags:
  - Download
  properties:
  - type: OpenAPI
    url: openapi/appen-download-api-openapi.yml
